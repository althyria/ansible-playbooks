- name: setup admin user and harden ssh
  hosts: examples
  tasks:
   - name: update system
     ansible.builtin.apt:
        upgrade: dist
        update_cache: true

   - name: install pkgs
     ansible.builtin.package:
        name: sudo, git, tree
        state: present

   - name: create admin user
     ansible.builtin.user:
        name: admin
        groups: sudo
        append: true
        password: $6$f8M8GIUVmEG2ccZT$R8IU1XAFcpO1r6v1nlsKbtK0fuAoydGA.P7C81yfHoM5T0XdnhrylC3pyB6WiDm/fn..QCtgO2HRAdlY9M/7a/

   - name: transfer admin ssh keys
     ansible.posix.authorized_key:
        user: admin
        key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN1H+DW/wbAjrTBx6oLkHni4rfrwRfcXRjaWw3XW2BRk

   - name: copy hardened sshd_config
     ansible.builtin.template:
        src: configs/sshd_config
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: '600'

   - name: restart sshd service
     ansible.builtin.service:
        name: sshd
        state: restarted

